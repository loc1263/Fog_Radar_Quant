name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-go:
    name: Backend Go (vet + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Formato
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: backend-go
          args: ./cmd/... ./internal/...
      - name: Tests (con detector de carreras)
        run: go test -race ./cmd/... ./internal/...

  frontend:
    name: Frontend (autofix + check + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Navegador para tests de componentes
        run: npx playwright install --with-deps chromium
      - name: Svelte autofixer
        run: npm run autofix
      - name: Tipos (svelte-check)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Tests unitarios y de componentes
        run: npm test
